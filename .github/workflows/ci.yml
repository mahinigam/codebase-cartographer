name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: |
          python -m pip install uv
          cd backend && uv sync

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Guard committed credentials
        run: |
          if grep -rEl '^\s*NEO4J_(AUTH|PASSWORD)=\S' \
              --include='.env*' --exclude-dir=.venv --exclude-dir=node_modules . ; then
            echo "::error::A non-empty NEO4J_* credential value is tracked in a committed .env* file."
            exit 1
          fi
          if grep -q 'NEO4J_AUTH:.*neo4j/[0-9A-Za-z]' docker-compose.yml; then
            echo "::error::docker-compose.yml contains a literal Neo4j password. Use \${NEO4J_PASSWORD:?} instead."
            exit 1
          fi

      - name: Run quality checks
        env:
          PYTHON_BIN: python
        run: bash ./check.sh
