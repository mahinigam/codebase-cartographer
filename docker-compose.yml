services:
  neo4j:
    image: neo4j:5-community
    container_name: codebase-cartographer-neo4j
    restart: unless-stopped
    ports:
      # Admin plane stays loopback-only: Neo4j Browser/HTTP and Bolt must never
      # be reachable from other network interfaces. The backend reaches Bolt
      # over the compose network (NEO4J_URI: bolt://neo4j:7687); a locally-run
      # backend uses the loopback mapping below.
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      # Fail fast instead of shipping a committed credential: generate a
      # per-deployment NEO4J_PASSWORD, e.g. `openssl rand -base64 24`.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set a generated NEO4J_PASSWORD in .env (e.g. openssl rand -base64 24)}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  backend:
    build:
      context: ./backend
    container_name: codebase-cartographer-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      ALLOWED_REPO_ROOTS: /workspace
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - ./:/workspace:ro
    depends_on:
      - neo4j

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://backend:8000
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    container_name: codebase-cartographer-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      NEXT_PUBLIC_DEFAULT_REPO: /workspace
    depends_on:
      - backend

volumes:
  neo4j_data:
  neo4j_logs:
