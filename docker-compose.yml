services:
  neo4j:
    image: neo4j:5-community
    container_name: codebase-cartographer-neo4j
    restart: unless-stopped
    ports:
      # Admin plane stays loopback-only: Neo4j Browser/HTTP and Bolt must never
      # be reachable from other network interfaces. The backend reaches Bolt
      # over the compose network (NEO4J_URI: bolt://neo4j:7687); a locally-run
      # backend uses the loopback mapping below.
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      # Fail fast instead of shipping a committed credential: generate a
      # per-deployment NEO4J_PASSWORD, e.g. `openssl rand -base64 24`.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set a generated NEO4J_PASSWORD in .env (e.g. openssl rand -base64 24)}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  backend:
    build:
      context: ./backend
    container_name: codebase-cartographer-backend
    restart: unless-stopped
    ports:
      # App plane: loopback by default. Set HOST_BIND=0.0.0.0 in .env to
      # expose the app to other machines (then also configure API_TOKEN and
      # CORS_ORIGINS — see README "Hardening for non-dev deployments").
      - "${HOST_BIND:-127.0.0.1}:8000:8000"
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      ALLOWED_REPO_ROOTS: /workspace
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - ./:/workspace:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://backend:8000
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    container_name: codebase-cartographer-frontend
    restart: unless-stopped
    ports:
      # App plane: loopback by default (see backend note re HOST_BIND).
      - "${HOST_BIND:-127.0.0.1}:5173:5173"
    environment:
      API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      NEXT_PUBLIC_DEFAULT_REPO: /workspace
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
